name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Prepare: bump version, update CHANGELOG, commit, tag
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    name: Bump Version & Tag
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.bump.outputs.VERSION_NAME }}
      version_code: ${{ steps.bump.outputs.VERSION_CODE }}
      tag: ${{ steps.bump.outputs.TAG }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          chmod +x scripts/bump-version.sh
          bash scripts/bump-version.sh "${{ github.event.inputs.bump }}"
          VERSION_NAME=$(grep '^android.versionName=' version.properties | cut -d= -f2)
          VERSION_CODE=$(grep '^android.versionCode=' version.properties | cut -d= -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Commit version bump
        run: |
          git add version.properties CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit (bump=none), skipping."
          else
            git commit -m "chore: bump version to ${{ steps.bump.outputs.VERSION_NAME }}"
            git push origin HEAD
          fi

      - name: Create tag
        run: |
          git tag "${{ steps.bump.outputs.TAG }}"
          git push origin "${{ steps.bump.outputs.TAG }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Android: build signed release APK
  # ─────────────────────────────────────────────────────────────────────────────
  android:
    name: Build Signed APK
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      apk_path: dist/CS3-Extension-Builder-${{ needs.prepare.outputs.tag }}.apk

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using production keystore"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ci/release.jks
            echo "KEY_STORE_PATH=$PWD/ci/release.jks" >> $GITHUB_ENV
            echo "KEY_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using sideload keystore"
            cat ci/sideload.jks.b64 | base64 -d > ci/release.jks
            echo "KEY_STORE_PATH=$PWD/ci/release.jks" >> $GITHUB_ENV
            echo "KEY_STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign & rename APK
        run: |
          mkdir -p dist
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          $APKSIGNER sign \
            --ks ci/release.jks \
            --ks-pass pass:$KEY_STORE_PASS \
            --key-pass pass:$KEY_PASS \
            --ks-key-alias $KEY_ALIAS \
            --out dist/CS3-Extension-Builder-${{ needs.prepare.outputs.tag }}.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: dist/CS3-Extension-Builder-${{ needs.prepare.outputs.tag }}.apk
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Release: create GitHub Release with signed APK
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ prepare, android ]

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: dist/

      - name: Generate release notes
        id: notes
        run: |
          chmod +x scripts/release-notes.sh
          NOTES=$(bash scripts/release-notes.sh "${{ needs.prepare.outputs.version_name }}")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "CS3 Extension Builder ${{ needs.prepare.outputs.tag }}"
          body: ${{ steps.notes.outputs.notes }}
          files: dist/CS3-Extension-Builder-${{ needs.prepare.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Discord
        if: ${{ vars.DISCORD_ENABLED == 'true' }}
        uses: Ilshidur/action-discord@0.3.2
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: |
            🚀 **CS3 Extension Builder ${{ needs.prepare.outputs.tag }} released!**
            Download: https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }}

      - name: Post to Telegram
        if: ${{ vars.TELEGRAM_ENABLED == 'true' }}
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: markdown
          message: |
            🚀 *CS3 Extension Builder ${{ needs.prepare.outputs.tag }} released\!*
            [Download APK](https://github.com/${{ github.repository }}/releases/tag/${{ needs.prepare.outputs.tag }})
