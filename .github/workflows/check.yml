name: Check

on:
  pull_request:
    branches: [ master, main ]

jobs:
  check:
    name: Compile & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|> Task .* FAILED|Could not resolve|AAPT|\.xml:[0-9]+" /tmp/gradle-build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          retention-days: 7
