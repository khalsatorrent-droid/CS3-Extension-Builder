name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        id: version
        run: |
          chmod +x scripts/bump-version.sh
          bash scripts/bump-version.sh patch
          VERSION_NAME=$(grep '^android.versionName=' version.properties | cut -d= -f2)
          VERSION_CODE=$(grep '^android.versionCode=' version.properties | cut -d= -f2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Commit & push version bump
        run: |
          git add version.properties CHANGELOG.md
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION_NAME }} [skip ci]"
            git push origin HEAD
          fi

      - name: Tag release
        run: |
          TAG="${{ steps.version.outputs.TAG }}"
          # Delete tag if it already exists (re-run case)
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true
          git tag "$TAG"
          git push origin "$TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using production keystore"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ci/release.jks
            echo "KEY_STORE_PASS=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using sideload keystore"
            cat ci/sideload.jks.b64 | base64 -d > ci/release.jks
            echo "KEY_STORE_PASS=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=release" >> $GITHUB_ENV
            echo "KEY_PASS=android" >> $GITHUB_ENV
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      - name: Print build log tail on failure
        if: failure()
        run: |
          echo "====== GRADLE BUILD LOG (last 200 lines) ======"
          tail -200 /tmp/gradle-build.log || true
          grep -E "^e:.*\.kt|error:|Caused by:|> Task .* FAILED|Could not resolve|unresolved reference|aapt2|\.xml:" /tmp/gradle-build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Sign & rename APK
        run: |
          mkdir -p dist
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -1)
          APK_NAME="CS3-Extension-Builder-${{ steps.version.outputs.TAG }}.apk"
          $APKSIGNER sign \
            --ks ci/release.jks \
            --ks-pass pass:$KEY_STORE_PASS \
            --key-pass pass:$KEY_PASS \
            --ks-key-alias $KEY_ALIAS \
            --out "dist/$APK_NAME" \
            app/build/outputs/apk/debug/app-debug.apk
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS3-Extension-Builder-${{ github.run_number }}
          path: dist/${{ env.APK_NAME }}
          retention-days: 30

      - name: Generate release notes
        id: notes
        run: |
          chmod +x scripts/release-notes.sh
          NOTES=$(bash scripts/release-notes.sh "${{ steps.version.outputs.VERSION_NAME }}")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create versioned GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "CS3 Extension Builder ${{ steps.version.outputs.TAG }}"
          body: ${{ steps.notes.outputs.notes }}
          files: dist/${{ env.APK_NAME }}
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post to Telegram
        if: ${{ vars.TELEGRAM_ENABLED == 'true' }}
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_TOPIC_ID }}
          format: markdown
          message: |
            🚀 *CS3 Extension Builder ${{ steps.version.outputs.TAG }} released\!*
            [Download APK](https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.TAG }})
